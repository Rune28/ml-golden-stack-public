<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document chat</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
    --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4362c; --mine: #e8effc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #98a2ae; --line: #2a3038;
      --accent: #5b8ff0; --accent-text: #0b0e12; --ok: #4cc27f; --warn: #e3a440; --bad: #ef6b61; --mine: #1f2a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  header { grid-column: 1 / -1; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 7px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.plain { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=file] { max-width: 100%; color: var(--muted); }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  .num { text-align: right; color: var(--muted); white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; margin-top: 8px; overflow-wrap: anywhere; }
  .error { color: var(--bad); }
  td.act { width: 1%; }
  td.act button { padding: 2px 8px; font-size: 12px; font-weight: 500; }
  .indexed { color: var(--ok); } .indexing { color: var(--warn); } .failed { color: var(--bad); }
  #messages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 60vh; overflow-y: auto; }
  .msg { padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--mine); align-self: flex-end; max-width: 85%; }
  .msg.assistant { background: var(--card); }
  .sources { margin-top: 6px; font-size: 12px; color: var(--muted); white-space: normal; }
  .empty { color: var(--muted); font-size: 14px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #chats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 40vh; overflow-y: auto; }
  #chats a { display: block; padding: 6px 8px; border-radius: 7px; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  #chats a:hover { background: var(--bg); }
  #chats a.current { background: var(--mine); }
  #chats small { display: block; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Document chat</h1>
    <p class="sub">Upload text files, then ask about them. The answers come from the files and name the chunks they used.</p>
  </header>

  <div class="col">
  <section class="card">
    <h2>Files</h2>
    <div class="row">
      <input type="file" id="file" accept=".txt,.md,.markdown" multiple>
      <button id="upload">Upload</button>
    </div>
    <div class="status" id="upload-status"></div>
    <table><tbody id="files"><tr><td class="empty">Loading…</td></tr></tbody></table>
  </section>

  <section class="card">
    <h2>Chats</h2>
    <ul id="chats"><li class="empty">Loading…</li></ul>
  </section>
  </div>

  <section class="card">
    <div class="row" style="justify-content: space-between">
      <h2 style="margin: 0">Chat</h2>
      <button class="plain" id="new-chat">New chat</button>
    </div>
    <div class="status" id="chat-id"></div>
    <div id="messages"><div class="empty">Ask a question about the uploaded files.</div></div>
    <textarea id="question" placeholder="Your question (Ctrl+Enter to send)"></textarea>
    <div class="row" style="margin-top: 8px">
      <button id="send">Send</button>
      <span class="status" id="chat-status" style="margin: 0"></span>
    </div>
  </section>
</main>

<script>
// The open chat is in the address (#chat=<id>): a reload, the back button or
// a link opens it again, with its history from the platform.
let chatId = null;
const $ = (id) => document.getElementById(id);

// One call to this service's API; an answer that is not ok becomes an Error
// with the message the platform (or this service) gave.
async function api(method, path, body, contentType) {
  const headers = contentType ? { "content-type": contentType } : {};
  const res = await fetch(path, { method, body, headers });
  const data = await res.json().catch(() => ({ error: `${res.status} ${res.statusText}` }));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;  // never innerHTML: file names and answers are text
  return node;
}

// An element around one child. (append() returns nothing, so it does not chain.)
function wrap(tag, child) {
  const node = el(tag);
  node.append(child);
  return node;
}

function size(bytes) {
  return bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
}

let refreshTimer = null;
async function refreshFiles() {
  clearTimeout(refreshTimer);
  const body = $("files");
  try {
    const files = await api("GET", "/api/files");
    body.replaceChildren();
    if (!files.length) body.append(wrap("tr", el("td", "empty", "No files yet.")));
    for (const f of files) {
      const row = el("tr");
      row.append(el("td", "", f.name), el("td", "num", size(f.size)));
      const state = f.status === "indexed" ? `indexed · ${f.chunks} chunks` : f.status;
      const status = el("td", `num ${f.status.replace(" ", "-")}`, state);
      if (f.error) status.title = f.error;
      const remove = el("button", "plain", "Delete");
      remove.onclick = () => deleteFile(f);
      const act = el("td", "act");
      act.append(remove);
      row.append(status, act);
      body.append(row);
    }
    // Poll while something is still being indexed.
    if (files.some((f) => f.status === "indexing")) refreshTimer = setTimeout(refreshFiles, 3000);
  } catch (e) {
    body.replaceChildren(wrap("tr", el("td", "error", `Files: ${e.message}`)));
  }
}

async function deleteFile(f) {
  if (!confirm(`Delete ${f.name}? Its chunks leave the answers at once.`)) return;
  const status = $("upload-status");
  try {
    await api("DELETE", `/api/files/${encodeURIComponent(f.file_id)}`);
    status.className = "status";
    status.textContent = `${f.name}: deleted`;
  } catch (e) {
    status.className = "status error";
    status.textContent = `${f.name}: ${e.message}`;
  }
  refreshFiles();
}

$("upload").onclick = async () => {
  const files = [...$("file").files];
  if (!files.length) return;
  const status = $("upload-status");
  $("upload").disabled = true;
  status.className = "status";
  const notes = [];
  for (const file of files) {
    status.textContent = `Uploading ${file.name}…`;
    try {
      const up = await api("POST", `/api/files?name=${encodeURIComponent(file.name)}`, file, "application/octet-stream");
      notes.push(up.duplicate ? `${file.name}: already uploaded` : `${file.name}: uploaded, indexing`);
    } catch (e) {
      notes.push(`${file.name}: ${e.message}`);
      status.className = "status error";
    }
  }
  status.textContent = notes.join(" · ");
  $("upload").disabled = false;
  $("file").value = "";
  refreshFiles();
};

function addMessage(role, text, sources) {
  const list = $("messages");
  list.querySelector(".empty")?.remove();
  const msg = el("div", `msg ${role}`, text);
  if (sources?.length) msg.append(el("div", "sources", "Sources: " + sources.map((s, i) => `[${i + 1}] ${s.name || "deleted file"}#${s.chunk_id}`).join(", ")));
  list.append(msg);
  list.scrollTop = list.scrollHeight;
  return msg;
}

async function send() {
  const text = $("question").value.trim();
  if (!text) return;
  const status = $("chat-status");
  $("send").disabled = true;
  status.className = "status";
  status.textContent = "Thinking… (up to a minute on a local model)";
  try {
    if (!chatId) {
      chatId = (await api("POST", "/api/chats")).chat_id;
      $("chat-id").textContent = `chat ${chatId}`;
      // Into the address without a hashchange: the chat is open already.
      history.replaceState(null, "", `#chat=${chatId}`);
    }
    addMessage("user", text);
    $("question").value = "";
    const answer = await api("POST", `/api/chats/${chatId}/messages`, JSON.stringify({ text }), "application/json");
    addMessage("assistant", answer.text, answer.sources);
    status.textContent = `turn ${answer.turn} · ${answer.model}`;
    refreshChats();
  } catch (e) {
    status.className = "status error";
    status.textContent = e.message;
  } finally {
    $("send").disabled = false;
  }
}

$("send").onclick = send;
$("question").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); };
$("new-chat").onclick = () => { location.hash = ""; };

function chatFromAddress() {
  const id = new URLSearchParams(location.hash.slice(1)).get("chat");
  return id && /^[0-9A-Za-z-]{1,64}$/.test(id) ? id : null;
}

// Shows the chat in the address, or an empty one, with its committed turns.
async function openChat() {
  chatId = chatFromAddress();
  const status = $("chat-status");
  status.className = "status";
  status.textContent = "";
  $("chat-id").textContent = chatId ? `chat ${chatId}` : "";
  $("messages").replaceChildren(el("div", "empty", "Ask a question about the uploaded files."));
  markCurrentChat();
  if (!chatId) return;
  try {
    const turns = await api("GET", `/api/chats/${chatId}/messages`);
    if (!turns.length) status.textContent = "No answered questions in this chat yet.";
    for (const m of turns) addMessage(m.role, m.text, m.sources);
  } catch (e) {
    status.className = "status error";
    status.textContent = `History: ${e.message}`;
  }
}

function markCurrentChat() {
  for (const a of $("chats").querySelectorAll("a")) a.classList.toggle("current", a.dataset.chat === chatId);
}

async function refreshChats() {
  const list = $("chats");
  try {
    const chats = await api("GET", "/api/chats");
    list.replaceChildren();
    if (!chats.length) list.append(el("li", "empty", "No chats yet."));
    for (const c of chats) {
      const link = el("a", "", c.title.length > 80 ? c.title.slice(0, 80) + "…" : c.title);
      link.href = `#chat=${c.chat_id}`;
      link.dataset.chat = c.chat_id;
      link.append(el("small", "", `${c.turns} ${c.turns === 1 ? "answer" : "answers"} · ${new Date(c.last_at * 1000).toLocaleString()}`));
      list.append(wrap("li", link));
    }
    markCurrentChat();
  } catch (e) {
    list.replaceChildren(el("li", "error", `Chats: ${e.message}`));
  }
}

window.addEventListener("hashchange", openChat);
refreshFiles();
refreshChats();
openChat();
</script>
</body>
</html>
