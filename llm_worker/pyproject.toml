[project]
name = "llm-worker"
version = "0.1.0"
description = "Temporal worker of the llm queue: events processed in the worker against the LLM server (workflow Index, activity index_file)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43",
    "clickhouse-connect>=1.10",
    "temporalio>=1.34,<2",
]

[project.scripts]
llm-worker = "worker.__main__:run"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker", "src/workflow", "src/rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
