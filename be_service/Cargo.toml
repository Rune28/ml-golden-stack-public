[package]
name = "be_service"
version = "0.1.0"
edition = "2024"
description = "Backend for the pipeline page: adds MNIST data to ClickHouse, later starts Temporal workflows"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clickhouse = "0.15"
flate2 = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
sha2 = "0.11"
temporalio-client = "1.1"
temporalio-common = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
