apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "llm-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "llm-worker.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "llm-worker.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The worker never talks to the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      # An activity cut by the restart is retried on the new pod, which
      # rewrites its partial rows. 30 s is enough to stop polling.
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.env.configMap }}
            - secretRef:
                name: {{ .Values.env.secret }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
