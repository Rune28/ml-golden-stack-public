image:
  repository: ghcr.io/rune28/chat-service
  tag: latest
  pullPolicy: IfNotPresent

# Settings (the platform API URL): a ConfigMap created next to the release.
configMap: chat-service

service:
  type: ClusterIP
  port: 8080

replicas: 1
# Changes of these roll the pods: e.g. a checksum of the settings they read at start.
podAnnotations: {}
nodeSelector: {}

# Holds at most one upload (up to 10 MiB) per request on its way to the platform.
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 96Mi }
