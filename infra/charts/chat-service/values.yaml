image:
  repository: ghcr.io/rune28/chat-service
  tag: latest
  pullPolicy: IfNotPresent

# Settings (the platform API, the database, the page's origins): a ConfigMap
# created next to the release; the database password: a Secret.
configMap: chat-service
secret: ""

service:
  type: ClusterIP
  port: 8080

replicas: 1
# Changes of these roll the pods: e.g. a checksum of the settings they read at start.
podAnnotations: {}
nodeSelector: {}

# Holds at most one upload (up to 10 MiB) per request on its way to the
# platform, and argon2id takes 19 MiB per login being checked.
resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { memory: 160Mi }
