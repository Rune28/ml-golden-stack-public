apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "batch-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "batch-worker.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "batch-worker.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      # A Job being waited for survives the restart: the retried activity
      # picks it up on the new pod. 30 s is enough to stop polling.
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: JOB_IMAGE
              value: {{ .Values.job.image | quote }}
            - name: JOB_ENV_CONFIG_MAP
              value: {{ .Values.env.configMap | quote }}
            - name: JOB_ENV_SECRET
              value: {{ .Values.env.secret | quote }}
          # The worker reads the Jobs' result.json from S3 with the same settings.
          envFrom:
            - configMapRef:
                name: {{ .Values.env.configMap }}
            - secretRef:
                name: {{ .Values.env.secret }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
