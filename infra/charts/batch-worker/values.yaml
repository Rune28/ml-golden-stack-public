image:
  repository: ghcr.io/rune28/batch-worker
  tag: latest
  # Locally the image is loaded into the kind nodes, in the cloud pulled from GHCR.
  pullPolicy: IfNotPresent

temporal:
  address: temporal-frontend.temporal.svc:7233
  namespace: default

# Connection settings (ClickHouse, S3, MLflow) shared by the worker and its
# Jobs: a ConfigMap and a Secret created next to the release.
env:
  configMap: pipeline-job
  secret: pipeline-job

job:
  # Image of the pipeline steps (mle-models).
  image: ghcr.io/rune28/mle-models:latest

replicas: 1
# Changes of these roll the pods: e.g. a checksum of the settings they read at start.
podAnnotations: {}
nodeSelector: {}

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }
