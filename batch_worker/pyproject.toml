[project]
name = "batch-worker"
version = "0.1.0"
description = "Temporal worker of the batch queue: workflows Train, Run and Report, activity run_job that runs each step as a Kubernetes Job"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43",
    "kubernetes>=37.0",
    "temporalio>=1.34,<2",
]

[project.scripts]
batch-worker = "worker.__main__:run"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker", "src/workflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
